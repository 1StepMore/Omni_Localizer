project_id: ol-phase0-test
source_lang: en
target_lang: zh
glossary_path: null
max_xliff_concurrent: 5
enable_lqa: true
lqa_threshold: 7.0
lqa_max_retries: 2
llm_pool:
  translation:
  - provider: openai
    model: ark-code-latest
    api_key: ${ARK_API_KEY}
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
    timeout: 120.0
    priority: 1
    role: translation
  - provider: openai
    model: stealth/ox-alpha
    api_key: ${COMMANDCODE_API_KEY}
    base_url: ${OPENCODE_GO_BASE_URL}
    timeout: 120.0
    priority: 2
    role: translation
  - provider: openai
    model: glm-4-flash
    priority: 3
    role: translation
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
  - provider: openai
    model: z-ai/glm-5.2
    priority: 4
    role: translation
    api_key: ${NVIDIA_NIM_API_KEY}
    base_url: https://integrate.api.nvidia.com/v1
    timeout: 120.0
  judging:
  - provider: openai
    model: ark-code-latest
    api_key: ${ARK_API_KEY}
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
    timeout: 120.0
    priority: 1
    role: judging
  - provider: openai
    model: stealth/ox-alpha
    api_key: ${COMMANDCODE_API_KEY}
    base_url: ${OPENCODE_GO_BASE_URL}
    timeout: 120.0
    priority: 2
    role: judging
  - provider: openai
    model: glm-4-flash
    priority: 3
    role: judging
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
  restoration:
  - provider: openai
    model: ark-code-latest
    api_key: ${ARK_API_KEY}
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
    timeout: 120.0
    priority: 1
    role: restoration
  - provider: openai
    model: stealth/ox-alpha
    api_key: ${COMMANDCODE_API_KEY}
    base_url: ${OPENCODE_GO_BASE_URL}
    timeout: 120.0
    priority: 2
    role: restoration
  - provider: openai
    model: glm-4-flash
    priority: 3
    role: restoration
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
  profiling:
  - provider: openai
    model: ark-code-latest
    api_key: ${ARK_API_KEY}
    base_url: https://ark.cn-beijing.volces.com/api/coding/v3
    timeout: 120.0
    priority: 1
    role: profiling
  - provider: openai
    model: stealth/ox-alpha
    api_key: ${COMMANDCODE_API_KEY}
    base_url: ${OPENCODE_GO_BASE_URL}
    timeout: 120.0
    priority: 2
    role: profiling
  - provider: openai
    model: glm-4-flash
    priority: 3
    role: profiling
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
quality_gates:
  inline_tags: true
  terminology: true
  source_script_check: true
  protocol_artifact_check: true
  block_on_source_script_fragment: true
  length_ratio:
    enabled: true
    min: 0.5
    max: 2.0
  locale:
    enabled: true
    target_locale: en-US
