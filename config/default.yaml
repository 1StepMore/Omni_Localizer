project_id: ol-phase0-test
source_lang: en
target_lang: zh
glossary_path: null
max_xliff_concurrent: 5
enable_lqa: true
lqa_threshold: 7.0
lqa_max_retries: 2
# CI nightly real-LLM is intentionally disabled: the only usable key
# (SPARK_API_KEY) is owner-local and never a repo secret (OL#183, 2026-11-11).
# The ZHIPU provider is an explicit-use fallback, not the nightly channel.
# 2026-11-12 real-traffic measurement (OL#193): glm-4.7-flash hit 429 on
# ~70-80% of free-tier calls (p50 ~114s on the lucky one) and long inputs came
# back with empty content after finish_reason=length, while glm-4-flash was
# 6/6 translation, 4/4 parseable judge JSON, p50 2.5s — so glm-4-flash takes
# priority 1 on every role and glm-4.7-flash drops to the last tier.
llm_pool:
  translation:
  - provider: openai
    model: glm-4-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 1
    role: translation
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: translation
  judging:
  - provider: openai
    model: glm-4-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 1
    role: judging
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: judging
  restoration:
  - provider: openai
    model: glm-4-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 1
    role: restoration
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: restoration
  profiling:
  - provider: openai
    model: glm-4-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 1
    role: profiling
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: profiling

quality_gates:
  inline_tags: true
  terminology: true
  source_script_check: true
  protocol_artifact_check: true
  invented_token_check: true
  # block_on_source_script_fragment is deliberately UNSET (= schema default
  # false). Gate 6 warns on a SINGLE residual CJK char, but this project's own
  # bar (suite STANDARDS.md#cjk-density) tolerates 5% for brand names and
  # proper nouns — blocking here would reject documents that pass the standard.
  # Use `ol translate-md --fail-on-untranslated` for strictness instead.
  length_ratio:
    enabled: true
    min: 0.5
    max: 2.0
  locale:
    enabled: true
    target_locale: en-US
