project_id: ol-phase0-test
source_lang: en
target_lang: zh
glossary_path: null
max_xliff_concurrent: 5
enable_lqa: true
lqa_threshold: 7.0
lqa_max_retries: 2
llm_pool:
  translation:
  - provider: openai
    model: DeepSeek-V4.1-Flash
    api_key: ${AMD_API_KEY}
    base_url: https://developer.amd.com.cn/radeon/api/v1
    timeout: 120.0
    priority: 1
    role: translation
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: translation
  judging:
  - provider: openai
    model: DeepSeek-V4.1-Flash
    api_key: ${AMD_API_KEY}
    base_url: https://developer.amd.com.cn/radeon/api/v1
    timeout: 120.0
    priority: 1
    role: judging
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: judging
  restoration:
  - provider: openai
    model: DeepSeek-V4.1-Flash
    api_key: ${AMD_API_KEY}
    base_url: https://developer.amd.com.cn/radeon/api/v1
    timeout: 120.0
    priority: 1
    role: restoration
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: restoration
  profiling:
  - provider: openai
    model: DeepSeek-V4.1-Flash
    api_key: ${AMD_API_KEY}
    base_url: https://developer.amd.com.cn/radeon/api/v1
    timeout: 120.0
    priority: 1
    role: profiling
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: profiling
quality_gates:
  inline_tags: true
  terminology: true
  source_script_check: true
  protocol_artifact_check: true
  block_on_source_script_fragment: true
  length_ratio:
    enabled: true
    min: 0.5
    max: 2.0
  locale:
    enabled: true
    target_locale: en-US
