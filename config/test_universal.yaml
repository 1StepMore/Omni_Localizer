# CI nightly real-LLM is intentionally disabled: the only usable key
# (SPARK_API_KEY) is owner-local and never a repo secret (OL#183, 2026-11-11).
# The ZHIPU provider is an explicit-use fallback, not the nightly channel.
llm_pool:
  translation:
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 1
    role: translation
  - provider: openai
    model: glm-4-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: translation
  # Generic OpenAI-compatible endpoint (suite#448): the omni-suite pipeline
  # pins OL_CONFIG_PATH to this file, so the generic triple must live here
  # too for `LLM_BASE_URL`+`LLM_API_KEY`+`LLM_MODEL` to reach the pipeline.
  # Skipped while any of the three is unset (router.partition_usable_models).
  - provider: openai
    model: ${LLM_MODEL}
    api_key: ${LLM_API_KEY}
    base_url: ${LLM_BASE_URL}
    timeout: 120.0
    priority: 3
    role: translation
  judging:
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 1
    role: judging
  - provider: openai
    model: glm-4-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: judging
  # Same generic endpoint triple as translation (suite#448): skipped while
  # any of LLM_BASE_URL / LLM_API_KEY / LLM_MODEL is unset.
  - provider: openai
    model: ${LLM_MODEL}
    api_key: ${LLM_API_KEY}
    base_url: ${LLM_BASE_URL}
    timeout: 120.0
    priority: 3
    role: judging
  restoration:
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 1
    role: restoration
  - provider: openai
    model: glm-4-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: restoration
  # Same generic endpoint triple as translation (suite#448): skipped while
  # any of LLM_BASE_URL / LLM_API_KEY / LLM_MODEL is unset.
  - provider: openai
    model: ${LLM_MODEL}
    api_key: ${LLM_API_KEY}
    base_url: ${LLM_BASE_URL}
    timeout: 120.0
    priority: 3
    role: restoration
