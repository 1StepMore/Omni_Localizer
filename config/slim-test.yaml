project_id: "ol-slim-real-llm"
source_lang: "zh"
target_lang: "en"
glossary_path: null
enable_lqa: true
lqa_threshold: 4.0
lqa_max_retries: 2
cache_system_prompt: true
# Mirror config/default.yaml (the source of truth): canonical ZHIPU-only pool
# (glm-4.7-flash + glm-4-flash), all api_key/base_url
# as ${ENV_VAR} refs. Parity is locked by
# tests/test_model_pool_config_parity.py — keep the two in sync.
max_xliff_concurrent: 5
# CI nightly real-LLM is intentionally disabled: the only usable key
# (SPARK_API_KEY) is owner-local and never a repo secret (OL#183, 2026-11-11).
# The ZHIPU provider is an explicit-use fallback, not the nightly channel.
llm_pool:
  translation:
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 1
    role: translation
  - provider: openai
    model: glm-4-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: translation
  judging:
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 1
    role: judging
  - provider: openai
    model: glm-4-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: judging
  restoration:
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 1
    role: restoration
  - provider: openai
    model: glm-4-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: restoration
  profiling:
  - provider: openai
    model: glm-4.7-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 1
    role: profiling
  - provider: openai
    model: glm-4-flash
    api_key: ${ZHIPU_API_KEY}
    base_url: https://open.bigmodel.cn/api/paas/v4
    timeout: 120.0
    priority: 2
    role: profiling
