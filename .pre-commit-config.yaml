repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.22.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check-secrets
        name: check-secrets (offline credential/URL scan)
        # Interpreter comes from scripts/pre_commit_python.sh — the same resolver
        # the suite uses. A bare `python3` hits the Microsoft Store execution
        # alias stub under Git Bash/CMD (exit 49) and is absent under WSL;
        # `language: python` is no better, because pre-commit would then
        # `pip install .` this repo into a throwaway hook env (build isolation
        # needs the index -> fails offline, and drags in the whole dependency
        # tree). The resolver probes candidates by executing them; no network.
        # check-secrets.py itself is stdlib-only.
        entry: bash scripts/pre_commit_python.sh scripts/check-secrets.py
        language: system
        stages: [pre-commit]
        pass_filenames: true
        require_serial: false

      - id: ol-path-denial-routing
        name: ol-path-denial-routing (validate_path must route through denial_for)
        # The path-denial bug class: a tool validates a path, discards which
        # branch rejected it, and re-emits one frozen containment message. A
        # reviewer reading a call site cannot see that; the AST guard can. This
        # hook runs only the ast_guard-marked tests, so it stays fast and never
        # needs an LLM or a network. Same interpreter resolver rationale as
        # check-secrets above — `language: system` + the resolver, never
        # `language: python` (which would try to install this repo offline).
        entry: bash scripts/pre_commit_python.sh -m pytest tests/test_path_denial_taxonomy.py -q -m ast_guard
        language: system
        stages: [pre-commit]
        pass_filenames: false
        require_serial: false
