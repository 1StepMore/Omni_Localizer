name: Real-LLM Nightly

# A11 — slim-pipeline-hardening. Nightly cron runs the real-LLM E2E
# suite against the canonical pool in config/local.yaml, in priority order
# (glm-4.7-flash / minimaxai/minimax-m3 / ark-code-latest). Cost is bounded
# at ~$0.08/month by the per-test pre-call cost gate in
# tests/real_llm/cost_estimator.py
# (budget_usd=5.0 per test, ~$0.005/test observed); rates come from
# OL_REAL_LLM_RATES and the gate fails closed on an unpriced model. The user
# authorized nightly cadence (per PR15 — E.2 calibration prep + nightly
# promotion). To go BACK to weekly cadence: change the cron below to
# "0 2 * * 0". See docs/real_llm_runbook.md for the runbook.
#
# Manual trigger: `gh workflow run "Real-LLM Nightly" --repo <org>/Omni_Localizer`
# Useful when validating a model swap or config change.

on:
  schedule:
    # 0 2 * * * = nightly at 02:00 UTC. User authorized nightly cadence
    # in PR15 (E.2 calibration prep + nightly promotion). See
    # docs/real_llm_runbook.md for rollback procedure.
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  real-llm-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No matrix: one run per cron tick. The 4 real-LLM tests share a
    # single ModelPool instance (session-scoped fixture) so multi-
    # matrixing would 4x the cost without 4x the signal.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip
        run: python -m pip install --upgrade pip

      - name: Install core deps
        run: >-
          python -m pip install
          litellm translate-toolkit markdown-it-py pydantic PyYAML
          pytest span-aligner typer jinja2 rich pytest-asyncio

      - name: Run real-LLM E2E suite
        env:
          OMNI_RUN_REAL_LLM: "1"
          # Canonical pool (config/default.yaml; `ol init` mirrors it into
          # config/local.yaml). ModelPool resolves every ${VAR} eagerly, so
          # all three keys must be present.
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          # Explicit per-1M-token USD rates for the cost gate, as JSON:
          #   {"ark-code-latest": [in, out], "glm-4.7-flash": [...], ...}
          # A repo *variable* (not a secret). Unset -> the gate fails closed
          # on the first estimate rather than guessing a price. See
          # docs/real_llm_runbook.md §Cost discipline.
          OL_REAL_LLM_RATES: ${{ vars.OL_REAL_LLM_RATES }}
          PYTHONPATH: src
        run: |
          echo "Real-LLM nightly run starting at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python -m pytest tests/real_llm/ -v --tb=short --durations=10 2>&1 | tee pytest-real-llm.log
          echo "Real-LLM nightly run finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-llm-pytest-log
          path: pytest-real-llm.log
          retention-days: 14

      - name: Summarize cost from log
        # Post-run sanity check: the suite has a $5/test budget cap. If
        # the cumulative cost looks unusual (e.g. >$0.10 for 4 small
        # tests), flag it. We don't parse the log strictly; this is a
        # soft warning for human review.
        if: always()
        run: |
          echo "=== Real-LLM nightly summary ==="
          echo "Exit code: ${{ job.status }}"
          echo "Tests run: see pytest-real-llm.log"
          echo "Cost: see cost_estimator.summary() in test output"
          echo "If cost > $0.10/night for 4 tests, refresh OL_REAL_LLM_RATES"
          echo "  (quarterly). See docs/real_llm_runbook.md §Recalibration cadence."
